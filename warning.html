<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Security Warning</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="warning-page">

  <div class="warning-container">
    <div class="warning-icon">!</div>

    <h1>High Risk URL Detected</h1>

    <p class="warning-message">
      This website appears suspicious based on heuristic URL analysis.
      For your safety, access has been blocked.
    </p>

    <div class="risk-card">
      <p class="risk-label">Risk Score</p>
      <p class="risk-score"><span id="score"></span>/100</p>
    </div>

    <div class="section">
      <h3>Blocked URL</h3>
      <div id="blockedUrl" class="url-box"></div>
    </div>

    <div class="section">
      <h3>Detection Reasons</h3>
      <ul id="reasons"></ul>
    </div>

    <button id="backBtn" class="back-button">Go Back to Safety</button>
  </div>

  <script src="warning.js"></script>
</body>
</html>
