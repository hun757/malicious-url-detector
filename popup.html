<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Malicious URL Detector</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-page">

  <div class="popup-card">
    <div class="popup-header">
      <div class="logo-circle">M</div>
      <div>
        <h2>URL Shield</h2>
        <p>Real-time URL protection</p>
      </div>
    </div>

    <div class="url-section">
      <p class="label">Current URL</p>
      <div id="url" class="popup-url-box">Loading...</div>
    </div>

    <div class="score-section">
      <div class="score-top">
        <span>Status</span>
        <span id="status" class="status-badge">Checking</span>
      </div>

      <div class="score-number">
        <span id="score">0</span>/100
      </div>

      <div class="risk-bar">
        <div id="riskFill" class="risk-fill"></div>
      </div>
    </div>

    <div class="reason-section">
      <p class="label">Detection Reasons</p>
      <ul id="reasons"></ul>
    </div>
    <button id="dashboardBtn" class="dashboard-button">
        Open Dashboard
    </button>
  </div>

  <script src="detector.js"></script>
  <script src="popup.js"></script>
</body>
</html>
